<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- The same drawing several ways, because nothing agrees on how to ask for
         an icon. iOS wants an opaque PNG for the home screen; the tab wants a
         small one; the manifest is for everyone else. All of them come out of
         design/logo-source.png via `npm run icons`, so they cannot drift. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Added to a phone's home screen, this is what makes it open as an app
         rather than a bookmark: no address bar, its own name under the icon,
         and a status bar the colour of the page instead of a white strip. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sovereign" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#0e1116" />

    <title>Sovereign — personal finance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
