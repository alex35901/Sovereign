<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- The same drawing several ways, because nothing agrees on how to ask for
         an icon. iOS wants an opaque PNG for the home screen; the tab wants a
         small one; the manifest is for everyone else. All of them come out of
         design/logo-source.png via `npm run icons`, so they cannot drift. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Asked for early, because the opening waits for it before it moves. -->
    <link rel="preload" as="image" href="/mark-192.png" />

    <!-- Added to a phone's home screen, this is what makes it open as an app
         rather than a bookmark: no address bar, its own name under the icon,
         and a status bar the colour of the page instead of a white strip. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sovereign" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#0e1116" />

    <title>Sovereign, personal finance</title>

    <!-- The opening hop.
         Written here rather than in the app because the point of it is the
         moment before the app exists: the bundle is still being fetched and
         parsed, and what this replaces is a blank page of whatever colour the
         browser guessed. Static markup and inline rules paint on the first
         frame; the app removes the whole thing once it has painted. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e1116;
        /* Never in the way of a finger. The app underneath is live the moment
           it mounts, and a reader who knows where they are going should not
           have to wait out an animation to press anything. */
        pointer-events: none;
        overflow: hidden;
        opacity: 1;
        transition: opacity 260ms ease-out;
      }
      :root[data-theme="light"] #boot { background: #f4f6f9; }
      #boot.gone { opacity: 0; }
      /* Two elements because the hop is two motions at once: the ground
         covered, and the arc over it. One transform cannot animate both on its
         own schedule, and nesting them composes the two. */
      /* Nothing moves until the drawing is there to move. An animation that
         starts while the icon is still being fetched spends its first hops on
         an empty square and arrives looking like a glitch. */
      .boot-travel { transform: translateX(calc(-50vw - 60px)); }
      #boot.ready .boot-travel { animation: boot-travel 1240ms cubic-bezier(.33, 0, .66, 1) both; }
      #boot.ready .boot-jump { animation: boot-jump 2000ms linear both; }
      .boot-jump { display: block; }
      /* A stencil rather than a picture: the file is the rabbit's shape in
         white on nothing, and what comes through it is a colour set here. One
         file serves both themes, and the orange stays with the tokens instead
         of being baked into a PNG. */
      .boot-mark {
        display: block;
        width: 92px;
        height: 92px;
        background-color: #ec7132;
        -webkit-mask: url(/mark-192.png) center / contain no-repeat;
        mask: url(/mark-192.png) center / contain no-repeat;
      }
      :root[data-theme="light"] .boot-mark { background-color: #cd5213; }
      @keyframes boot-travel {
        from { transform: translateX(calc(-50vw - 60px)); }
        to { transform: translateX(0); }
      }
      @keyframes boot-jump {
        /* Four hops across, each a rise and a landing. */
        0%   { transform: translateY(0) scale(1, 1); }
        6%   { transform: translateY(-30px) scale(.94, 1.06); }
        15%  { transform: translateY(0) scale(1.06, .94); }
        21%  { transform: translateY(-30px) scale(.94, 1.06); }
        30%  { transform: translateY(0) scale(1.06, .94); }
        36%  { transform: translateY(-30px) scale(.94, 1.06); }
        45%  { transform: translateY(0) scale(1.06, .94); }
        51%  { transform: translateY(-30px) scale(.94, 1.06); }
        62%  { transform: translateY(0) scale(1.06, .94); }
        /* And then at the middle it comes at you, and lands. */
        68%  { transform: translateY(2px) scale(.92, .92); }
        80%  { transform: translateY(-14px) scale(1.55, 1.55); }
        92%  { transform: translateY(0) scale(.97, .97); }
        100% { transform: translateY(0) scale(1, 1); }
      }
      /* Asked not to move things: the mark is still there and the page still
         has something on it, it simply arrives rather than performing. */
      @media (prefers-reduced-motion: reduce) {
        #boot.ready .boot-travel, #boot.ready .boot-jump { animation: none; }
        .boot-travel { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true" hidden>
      <span class="boot-travel"><span class="boot-jump">
        <span class="boot-mark"></span>
      </span></span>
    </div>
    <script>
      /*
       * Two things that have to happen before the first frame.
       *
       * The theme, because the app only knows which one to wear once it has
       * read the document, and until then every load was a flash of the dark
       * page at somebody who chose the light one. Remembered in a key of its
       * own: reading it costs nothing, where parsing the whole cached document
       * here would cost the very moment this is trying to protect.
       *
       * And whether to hop at all. Once per open, not once per page: a reader
       * who reloads twice in a minute is not arriving, and the app's own
       * routing never reloads, so this is exactly the cold start.
       */
      (function () {
        try {
          var theme = localStorage.getItem("sovereign.theme");
          if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch (e) { /* storage refused; the default stands */ }
        var boot = document.getElementById("boot");
        try {
          if (sessionStorage.getItem("sovereign.opened")) { boot.remove(); return; }
          sessionStorage.setItem("sovereign.opened", "1");
        } catch (e) { /* no session storage, so every load is a first one */ }
        /*
         * The clock starts when the rabbit does, not when the page was asked
         * for. Otherwise a slow bundle eats the opening: the app paints late,
         * finds the time already spent, and takes the hop away mid-air.
         */
        window.__bootReady = function () {
          if (window.__bootAt) return;
          window.__bootAt = Date.now();
          boot.classList.add("ready");
        };
        /*
         * The stencil is fetched here rather than waited on in the page,
         * because a mask has no load event of its own. The browser serves the
         * same file to the mask out of its cache, so this is the moment it is
         * ready to be painted through. One that never arrives at all must not
         * hold the opening for ever.
         */
        var pre = new Image();
        pre.onload = window.__bootReady;
        pre.onerror = window.__bootReady;
        pre.src = "/mark-192.png";
        if (pre.complete) window.__bootReady();
        window.setTimeout(window.__bootReady, 900);
        boot.hidden = false;
        /*
         * Said on the root so a stylesheet can hold the things that play once
         * on arrival, and the app clears it when the rabbit goes. The timer is
         * against the app never getting that far: a chart held at nothing for
         * ever is a worse failure than an opening cut short, and this is the
         * only place that can promise it ends.
         */
        document.documentElement.setAttribute("data-booting", "");
        window.setTimeout(function () {
          document.documentElement.removeAttribute("data-booting");
          window.dispatchEvent(new Event("sovereign:opened"));
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
